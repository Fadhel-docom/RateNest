name: Deploy RateNest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job below adds only what it needs.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    name: Test before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      - name: Run static site checks
        run: node scripts/check-site.mjs

  deploy:
    name: Publish site
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage public site files only
        # Publish only the site itself (not tests, scripts, or workflow files).
        # If you add new public files (images, pages), list them here.
        run: |
          mkdir _site
          cp index.html styles.css app.mjs calculator.mjs sitemap.xml _site/
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
